<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitor Leakage Circuit Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #ef4444;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            transition: transform 0.15 ease, background-color 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header Section -->
    <header class="text-center mb-6">
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-red-400 to-purple-400">
            Capacitor Leakage Circuit Simulation
        </h1>
        <p class="text-slate-400 text-sm md:text-base mt-2">
            Capacitor စိမ့်ထွက်မှု (Leaking) ကြောင့် ညာဘက်အထွက် တန်ဖိုး လျော့နည်းသွားပုံ
        </p>
    </header>

    <!-- Main Card Container -->
    <div class="w-full max-w-4xl bg-slate-800/90 backdrop-blur border border-slate-700/60 rounded-2xl shadow-2xl p-6 flex flex-col items-center">
        
        <!-- Canvas Container -->
        <div class="w-full relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner mb-6">
            <canvas id="circuitCanvas" class="w-full h-[320px] md:h-[380px] block"></canvas>
        </div>

        <!-- Controls Grid -->
        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/70 p-5 rounded-xl border border-slate-800">
            
            <!-- Base Value Control -->
            <div class="flex flex-col gap-2">
                <label for="baseInput" class="text-sm font-semibold text-blue-400 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                    Base Value (ဝင်ရောက်တန်ဖိုး):
                </label>
                <input type="number" id="baseInput" value="560" min="0" max="2000" step="10"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-blue-300 font-bold focus:outline-none focus:border-blue-500 transition-colors">
            </div>

            <!-- Damage / Leakage Control -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label for="leakageSlider" class="text-sm font-semibold text-red-400 flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-red-500"></span>
                        Capacitor Leakage (စိမ့်ထွက်မှု တန်ဖိုး):
                    </label>
                    <span id="damagePercentageBadge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-red-500/20 text-red-400 border border-red-500/30">
                        35.7% ပျက်
                    </span>
                </div>
                
                <div class="flex items-center gap-3">
                    <input type="range" id="leakageSlider" min="0" max="560" value="200" step="5"
                        class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    <input type="number" id="leakageInput" value="200" min="0" max="2000" step="5"
                        class="w-28 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-red-400 font-bold focus:outline-none focus:border-red-500 transition-colors">
                </div>
            </div>

        </div>

        <!-- Calculation Display Box -->
        <div class="mt-6 w-full flex flex-wrap items-center justify-center gap-3 text-lg font-bold bg-slate-950/80 py-3 px-6 rounded-lg border border-slate-800">
            <span class="text-blue-400" id="formulaBase">560</span>
            <span class="text-slate-500">-</span>
            <span class="text-red-400" id="formulaLeakage">200</span>
            <span class="text-slate-500">=</span>
            <span class="text-purple-400 text-2xl font-extrabold" id="formulaOutput">360</span>
            <span class="text-xs font-normal text-slate-400 ml-2">(ထွက်ရှိတန်ဖိုး)</span>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');

        const baseInput = document.getElementById('baseInput');
        const leakageSlider = document.getElementById('leakageSlider');
        const leakageInput = document.getElementById('leakageInput');
        const damagePercentageBadge = document.getElementById('damagePercentageBadge');

        const formulaBase = document.getElementById('formulaBase');
        const formulaLeakage = document.getElementById('formulaLeakage');
        const formulaOutput = document.getElementById('formulaOutput');

        let baseValue = 560;
        let leakageValue = 200;
        let outputValue = 360;

        // Main circuit particles
        const mainParticles = [];
        const leakageParticles = [];

        for (let i = 0; i < 30; i++) {
            mainParticles.push({
                progress: Math.random(),
                speed: 0.003 + Math.random() * 0.002
            });
        }

        for (let i = 0; i < 20; i++) {
            leakageParticles.push({
                progress: Math.random(),
                speed: 0.004 + Math.random() * 0.003
            });
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateCalculations() {
            baseValue = parseFloat(baseInput.value) || 0;
            leakageValue = parseFloat(leakageInput.value) || 0;
            
            // Adjust max range dynamically if base increases
            leakageSlider.max = baseValue > 0 ? baseValue : 100;
            
            outputValue = Math.max(0, baseValue - leakageValue);

            const damagePercent = baseValue > 0 ? ((leakageValue / baseValue) * 100).toFixed(1) : 0;

            // Update DOM Elements
            formulaBase.textContent = baseValue;
            formulaLeakage.textContent = leakageValue;
            formulaOutput.textContent = outputValue;
            damagePercentageBadge.textContent = `${damagePercent}% ပျက်`;
        }

        // Event Listeners
        baseInput.addEventListener('input', () => {
            updateCalculations();
        });

        leakageSlider.addEventListener('input', (e) => {
            leakageInput.value = e.target.value;
            updateCalculations();
        });

        leakageInput.addEventListener('input', (e) => {
            leakageSlider.value = e.target.value;
            updateCalculations();
        });

        // Helper: Rounded Rectangle
        function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle, strokeStyle) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();

            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }
            if (strokeStyle) {
                ctx.strokeStyle = strokeStyle;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Helper: Capacitor Schematic Symbol
        function drawCapacitor(ctx, x, y) {
            const capWidth = 30;
            const gap = 12;

            // Top Plate
            ctx.beginPath();
            ctx.moveTo(x - capWidth / 2, y - gap / 2);
            ctx.lineTo(x + capWidth / 2, y - gap / 2);
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Bottom Plate
            ctx.beginPath();
            ctx.moveTo(x - capWidth / 2, y + gap / 2);
            ctx.lineTo(x + capWidth / 2, y + gap / 2);
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 4;
            ctx.stroke();
        }

        // Helper: Ground Symbol
        function drawGround(ctx, x, y) {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;

            // Wire to ground
            ctx.beginPath();
            ctx.moveTo(x, y - 10);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Horizontal lines for ground symbol
            const widths = [30, 20, 10];
            const spacing = 6;
            widths.forEach((w, index) => {
                ctx.beginPath();
                ctx.moveTo(x - w / 2, y + index * spacing);
                ctx.lineTo(x + w / 2, y + index * spacing);
                ctx.stroke();
            });
        }

        // Helper: Red Arrow for Leakage
        function drawLeakArrow(ctx, x, startY, endY) {
            if (leakageValue <= 0) return;

            const arrowY = startY + (endY - startY) * 0.55;
            
            ctx.beginPath();
            ctx.moveTo(x + 18, startY);
            ctx.lineTo(x + 18, arrowY);
            ctx.strokeStyle = '#ef4444';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Arrow head
            ctx.beginPath();
            ctx.moveTo(x + 12, arrowY - 8);
            ctx.lineTo(x + 18, arrowY + 4);
            ctx.lineTo(x + 24, arrowY - 8);
            ctx.fillStyle = '#ef4444';
            ctx.fill();

            // Leakage Value Label next to arrow
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText(leakageValue, x + 28, arrowY + 2);
        }

        // Main Animation Loop
        function animate() {
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;

            ctx.clearRect(0, 0, w, h);

            // Positioning Logic
            const blockWidth = Math.min(130, w * 0.22);
            const blockHeight = Math.min(130, h * 0.45);
            const blockX = 20;
            const blockY = h * 0.22;
            const mainY = blockY + blockHeight / 2;

            const lineStartX = blockX + blockWidth;
            const lineEndX = w - 80;
            const capX = lineStartX + (lineEndX - lineStartX) * 0.5;
            const groundY = mainY + 110;

            // --- 1. Draw Main Line (Input to Output) ---
            ctx.beginPath();
            ctx.moveTo(lineStartX, mainY);
            ctx.lineTo(lineEndX, mainY);
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;
            ctx.stroke();

            // --- 2. Draw Branch Line to Capacitor & Ground ---
            ctx.beginPath();
            ctx.moveTo(capX, mainY);
            ctx.lineTo(capX, mainY + 25);
            ctx.moveTo(capX, mainY + 40);
            ctx.lineTo(capX, groundY - 10);
            ctx.strokeStyle = '#f87171';
            ctx.lineWidth = 3;
            ctx.stroke();

            // --- 3. Draw Capacitor & Ground Symbols ---
            drawCapacitor(ctx, capX, mainY + 32);
            drawGround(ctx, capX, groundY);

            // --- 4. Draw Red Leakage Arrow & Value ---
            drawLeakArrow(ctx, capX, mainY + 45, groundY - 10);

            // --- 5. Draw Left Base Box ---
            drawRoundedRect(ctx, blockX, blockY, blockWidth, blockHeight, 18, '#3b82f6', '#60a5fa');
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(baseValue, blockX + blockWidth / 2, blockY + blockHeight / 2);

            // --- 6. Draw Right Output Value ---
            ctx.fillStyle = outputValue === 0 ? '#ef4444' : '#a855f7';
            ctx.font = 'bold 26px Inter, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(outputValue, lineEndX + 18, mainY);

            // --- 7. Draw Damage Percentage Badge on Top Right Canvas ---
            const damagePercent = baseValue > 0 ? ((leakageValue / baseValue) * 100).toFixed(0) : 0;
            ctx.fillStyle = '#ef4444';
            ctx.font = 'bold 22px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`${damagePercent}% ပျက်`, w - 25, 40);

            // --- 8. Particle Animations ---

            // Main path particles (Input -> Output)
            const outputFlowRatio = baseValue > 0 ? outputValue / baseValue : 0;

            mainParticles.forEach(p => {
                p.progress += p.speed;
                if (p.progress > 1) p.progress = 0;

                const currentX = lineStartX + p.progress * (lineEndX - lineStartX);

                // If particle is past capacitor, only show based on output ratio
                if (currentX > capX && Math.random() > outputFlowRatio && outputFlowRatio < 0.9) {
                    return;
                }

                ctx.beginPath();
                ctx.arc(currentX, mainY, 3.5, 0, Math.PI * 2);
                ctx.fillStyle = currentX > capX ? '#c084fc' : '#60a5fa';
                ctx.shadowColor = currentX > capX ? '#c084fc' : '#60a5fa';
                ctx.shadowBlur = 6;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Leakage path particles (Capacitor -> Ground)
            if (leakageValue > 0) {
                const leakIntensity = Math.min(1, leakageValue / (baseValue || 1));
                const activeLeakParticles = Math.ceil(leakageParticles.length * leakIntensity);

                for (let i = 0; i < activeLeakParticles; i++) {
                    const p = leakageParticles[i];
                    p.progress += p.speed * (1 + leakIntensity);
                    if (p.progress > 1) p.progress = 0;

                    const currentY = (mainY + 42) + p.progress * (groundY - 10 - (mainY + 42));

                    ctx.beginPath();
                    ctx.arc(capX, currentY, 3, 0, Math.PI * 2);
                    ctx.fillStyle = '#ef4444';
                    ctx.shadowColor = '#f87171';
                    ctx.shadowBlur = 6;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            requestAnimationFrame(animate);
        }

        // Initialize App
        updateCalculations();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
